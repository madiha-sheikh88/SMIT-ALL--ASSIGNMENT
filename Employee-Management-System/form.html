<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form of EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="form-page">
    <main>
        <form id="registration-form">
            <h1 class="main-heading">Add New Employee</h1>
            <section class="container my-2">
                <h3 class="d-flex align-item-center gap-2 py-4"><span class="svg-info"><svg
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-user w-5 h-5" aria-hidden="true" style="color:#0B73B7">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg></span><span>Personal Details</span></h3>
                <div class="row">
                    <!-- Full Name field -->
                    <div class="col-md-12 col-lg-6"> <label for="full-name" class="form-label">Full Name <span
                                class="mandatory">*</span></label>
                        <input type="text" class="form-control form-control-md p-3 mb-3" id="full-name"
                            placeholder="Enter your full name">
                    </div>
                    <!-- Email field -->
                    <div class="col-md-12 col-lg-6"> <label for="email" class="form-label">Email <span
                                class="mandatory">*</span></label>
                        <input type="email" class="form-control form-control-md p-3 mb-3" id="email"
                            placeholder="your.email@example.com">
                    </div>
                    <!-- Phone Number field -->
                    <div class="col-md-12 col-lg-6"> <label for="phone-number" class="form-label">Phone Number <span
                                class="mandatory">*</span></label>
                        <input type="tel" class="form-control form-control-md p-3 mb-3" id="phone-number"
                            placeholder="Enter your phone number">
                    </div>
            </section>

            <section class="container my-2">
                <h3 class="d-flex align-item-center gap-2 py-4"><span class="svg-info"><svg
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-user w-5 h-5" aria-hidden="true" style="color:#0B73B7">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg></span><span>Employment Details</span></h3>
                <div class="row">

                    <!-- Employee ID field -->
                    <div class="col-md-12 col-lg-6"> <label for="Employee-ID" class="form-label">Employee ID <span
                                class="mandatory">*</span></label>
                        <input type="text" class="form-control form-control-md p-3 mb-3" id="Employee-ID"
                            placeholder="Enter your Employee ID">
                    </div>
                    <!-- Select Department -->
                    <div class="col-md-12 col-lg-6"> <label for="Department" class="form-label">Department
                            <span class="mandatory">*</span></label>
                        <select id="Department" class="form-select form-select-md p-3 mb-3"
                            aria-label="Default select example">
                            <option selected>Select your Department</option>
                            <option value="Human-Resources">Human Resources</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                    <!-- Position field -->
                    <div class="col-md-12 col-lg-6"> <label for="Position" class="form-label">Position <span
                                class="mandatory">*</span></label>
                        <input type="text" class="form-control form-control-md p-3 mb-3" id="Position"
                            placeholder="Enter your Position">
                    </div>
                    <!-- salary field -->
                    <div class="col-md-12 col-lg-6"> <label for="salary" class="form-label">Salary <span
                                class="mandatory">*</span></label>
                        <input type="number" class="form-control form-control-md p-3 mb-3" id="salary"
                            placeholder="Enter your salary">
                    </div>
                    <!-- date of joining field -->
                    <div class="col-md-12 col-lg-6"> <label for="doj" class="form-label">Date of Joining <span
                                class="mandatory">*</span></label>
                        <input type="date" class="form-control form-control-md p-3 mb-3" id="doj">
                    </div>
                    <!-- Select Status ( Active, Probation, Trainee) field -->
                    <div class="col-md-12 col-lg-6"> <label for="status" class="form-label">Status
                            <span class="mandatory">*</span></label>
                        <select id="status" class="form-select form-select-md p-3 mb-3"
                            aria-label="Default select example">
                            <option selected>Status</option>
                            <option value="Active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                </div>
            </section>
            <section class="container my-2">
                <div class="button-group">
                    <button class="btn btn-cancel">Cancel</button>
                    <button class="btn btn-save">Save & Add Employee</button>
                </div>

            </section>


        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./app.js"></script>
</body>

</html>
