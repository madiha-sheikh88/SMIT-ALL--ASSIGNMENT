<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form of EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
<main>
<form id="registration-form">
    <section class="container">
<h3 class="d-flex align-item-center gap-2 py-4"><span class="svg-info"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-user w-5 h-5" aria-hidden="true" style="color:#0B73B7">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg></span><span>Employee Information</span></h3>
            <div class="row">
                <!-- Full Name field -->
                <div class="col-md-12 col-lg-6"> <label for="full-name" class="form-label">Full Name <span
                            class="mandatory">*</span></label>
                    <input type="text" class="form-control form-control-md p-3 mb-3" id="full-name"
                        placeholder="Enter your full name">
                </div>
                <!-- Father Name field -->
                <div class="col-md-12 col-lg-6"> <label for="Father-name" class="form-label">Father Name <span
                            class="mandatory">*</span></label>
                    <input type="text" class="form-control form-control-md p-3 mb-3" id="Father-name"
                        placeholder="Enter Father's name">
                </div>
                <!-- date of birth field -->
                <div class="col-md-12 col-lg-6"> <label for="dob" class="form-label">Date of Birth <span
                            class="mandatory">*</span></label>
                    <input type="date" class="form-control form-control-md p-3 mb-3" id="dob">
                </div>
                <!-- Email field -->
                <div class="col-md-12 col-lg-6"> <label for="email" class="form-label">Email <span
                            class="mandatory">*</span></label>
                    <input type="email" class="form-control form-control-md p-3 mb-3" id="email"
                        placeholder="your.email@example.com">
                </div>
                <!-- Phone Number field -->
                <div class="col-md-12 col-lg-6"> <label for="phone-number" class="form-label">Phone Number <span
                            class="mandatory">*</span></label>
                    <input type="tel" class="form-control form-control-md p-3 mb-3" id="phone-number"
                        placeholder="Enter phone number">
                </div>
                <!-- Father'sPhone Number field -->
                <div class="col-md-12 col-lg-6"> <label for="Fphone-number" class="form-label">Father's Phone <span
                            class="mandatory">*</span></label>
                    <input type="tel" class="form-control form-control-md p-3 mb-3" id="Fphone-number"
                        placeholder="Enter phone number">
                </div>
                <!-- ID Number field -->
                <div class="col-md-12 col-lg-6"> <label for="ID-No" class="form-label">ID Number <span
                            class="mandatory">*</span></label>
                    <input type="text" class="form-control form-control-md p-3 mb-3" id="ID-No"
                        placeholder="Enter ID number">
                </div>
                <!-- Father's ID Number field -->
                <div class="col-md-12 col-lg-6"> <label for="FID-No" class="form-label">Father's ID Number <span
                            class="mandatory">*</span></label>
                    <input type="text" class="form-control form-control-md p-3 mb-3" id="FID-No"
                        placeholder="Enter  ID number">
                </div>
                <!-- address field -->
                <div class="col-12"> <label for="address" class="form-label">Address <span
                            class="mandatory">*</span></label>
                    <input type="text" class="form-control form-control-md pb-5 mb-3" id="address"
                        placeholder="Enter your complete address (Minimum 10 characters)">
                </div>
            </div>
    </section>
    
    
    
</form>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./app.js"></script>
</body>

</html>
