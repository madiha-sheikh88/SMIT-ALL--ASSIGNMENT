<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section>
        <h1>Digital Calculator</h1>
        <div class="calculator">
                <input class="display" readonly>
            <div class="all-btns">
                <button class="btn" data-value="7">7</button>
                <button class="btn" data-value="8">8</button>
                <button class="btn" data-value="9">9</button>
                <button class="btn operator-btn" data-value="/">/</button>
                <button class="btn" data-value="4">4</button>
                <button class="btn" data-value="5">5</button>
                <button class="btn" data-value="6">6</button>
                <button class="btn operator-btn" data-value="*">*</button>
                <button class="btn" data-value="1">1</button>
                <button class="btn" data-value="2">2</button>
                <button class="btn" data-value="3">3</button>
                <button class="btn operator-btn" data-value="-">-</button>
                <button class="btn" data-value="0">0</button>
                <button class="btn" data-value=".">.</button>
                <button class="btn equals" data-value="=">=</button>
                <button class="btn operator-btn" data-value="+">+</button>
                <button class="btn reset" data-value="Reset">C</button>
                <button class="btn reset clear" data-value="Reset">CE</button>
            </div>

        </div>


    </section>
    <script src="./script.js"></script>
</body>
</html>
