<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | ServiceHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<nav class="navbar navbar-light fixed-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <span class="logo-icon">
                <i class="bi bi-tools"></i>
            </span>

            Service<span>Hub</span>
        </a>

        <div class="nav-actions">

            <button class="theme-btn" id="themeToggle">
                <i class="bi bi-moon"></i>
            </button>

            <a href="services.html" class="btn btn-primary">
                Book Service
            </a>

        </div>

    </div>

</nav>


<section class="section dashboard-page">

    <div class="container">

        <div class="dashboard-header">

            <div>

                <span class="section-label">
                    CUSTOMER DASHBOARD
                </span>

                <h1>My bookings</h1>

                <p>
                    Track and manage your service requests.
                </p>

            </div>

        </div>


        <div class="dashboard-stats">

            <div class="dashboard-stat">
                <i class="bi bi-calendar-check"></i>
                <div>
                    <strong id="totalBookings">0</strong>
                    <span>Total bookings</span>
                </div>
            </div>

            <div class="dashboard-stat">
                <i class="bi bi-hourglass-split"></i>
                <div>
                    <strong id="pendingBookings">0</strong>
                    <span>Pending</span>
                </div>
            </div>

            <div class="dashboard-stat">
                <i class="bi bi-check-circle"></i>
                <div>
                    <strong id="completedBookings">0</strong>
                    <span>Completed</span>
                </div>
            </div>

        </div>


        <div class="booking-table-card">

            <div class="table-header">

                <h4>Recent bookings</h4>

                <a href="services.html">
                    Find a professional
                    <i class="bi bi-arrow-right"></i>
                </a>

            </div>

            <div class="table-responsive">

                <table class="table">

                    <thead>

                        <tr>
                            <th>Booking ID</th>
                            <th>Provider</th>
                            <th>Service</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="customerBookings"></tbody>

                </table>

            </div>

        </div>

    </div>

</section>


<script src="./script.js"></script>

</body>
</html>
