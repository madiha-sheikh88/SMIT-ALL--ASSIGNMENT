<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Service | ServiceHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<nav class="navbar navbar-light fixed-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">

            <span class="logo-icon">
                <i class="bi bi-tools"></i>
            </span>

            Service<span>Hub</span>

        </a>

        <button class="theme-btn" id="themeToggle">
            <i class="bi bi-moon"></i>
        </button>

    </div>

</nav>


<section class="section booking-page">

    <div class="container">

        <div class="booking-heading">

            <span class="section-label">
                BOOK A SERVICE
            </span>

            <h1>Schedule your service</h1>

            <p>
                Tell us what you need and choose a convenient
                time for your professional.
            </p>

        </div>


        <div class="row g-4">

            <div class="col-lg-7">

                <div class="form-card">

                    <form id="bookingForm">

                        <div class="mb-4">

                            <label class="form-label">
                                Service
                            </label>

                            <select
                                id="bookingService"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select service
                                </option>

                                <option>Electrician</option>
                                <option>Plumber</option>
                                <option>Beauty</option>
                                <option>AC Repair</option>
                                <option>Cleaning</option>
                                <option>Tutor</option>

                            </select>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Date
                                </label>

                                <input
                                    type="date"
                                    id="bookingDate"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-4">

                                <label class="form-label">
                                    Time
                                </label>

                                <input
                                    type="time"
                                    id="bookingTime"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                id="bookingLocation"
                                class="form-control"
                                placeholder="Enter your address"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Describe your problem
                            </label>

                            <textarea
                                id="bookingDescription"
                                class="form-control"
                                rows="5"
                                placeholder="Tell the provider what you need..."
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >

                            Confirm Booking
                            <i class="bi bi-arrow-right"></i>

                        </button>

                    </form>

                </div>

            </div>


            <div class="col-lg-5">

                <div class="booking-summary">

                    <span class="section-label">
                        BOOKING SUMMARY
                    </span>

                    <div id="bookingProvider">
                        <div class="summary-placeholder">

                            <i class="bi bi-person-circle"></i>

                            <p>
                                Your selected provider
                                will appear here.
                            </p>

                        </div>
                    </div>

                    <hr>

                    <div class="summary-item">
                        <span>Service</span>
                        <strong id="summaryService">
                            Not selected
                        </strong>
                    </div>

                    <div class="summary-item">
                        <span>Date</span>
                        <strong id="summaryDate">
                            Not selected
                        </strong>
                    </div>

                    <div class="summary-item">
                        <span>Time</span>
                        <strong id="summaryTime">
                            Not selected
                        </strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script src="./script.js"></script>

</body>
</html>
