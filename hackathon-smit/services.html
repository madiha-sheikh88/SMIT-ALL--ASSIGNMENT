<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services | ServiceHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <span class="logo-icon">
                <i class="bi bi-tools"></i>
            </span>
            Service<span>Hub</span>
        </a>

        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="services.html">
                        Services
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="customer-dashboard.html">
                        My Bookings
                    </a>
                </li>
            </ul>

            <div class="nav-actions">
                <button class="theme-btn" id="themeToggle">
                    <i class="bi bi-moon"></i>
                </button>

                <a href="login.html" class="btn btn-outline-primary">
                    Login
                </a>
            </div>

        </div>
    </div>
</nav>


<section class="page-header">
    <div class="container">

        <span class="section-label">DISCOVER</span>

        <h1>Find a professional</h1>

        <p>
            Browse trusted professionals and find the right
            person for your job.
        </p>

        <div class="large-search">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search services or providers..."
            >

        </div>

    </div>
</section>


<section class="section providers-page">
    <div class="container">

        <div class="row">

            <!-- FILTERS -->
            <div class="col-lg-3">

                <div class="filter-box">

                    <h5>Filters</h5>

                    <hr>

                    <label>Category</label>

                    <select id="categoryFilter" class="form-select">
                        <option value="all">All categories</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumber">Plumber</option>
                        <option value="Beauty">Beauty</option>
                        <option value="AC Repair">AC Repair</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Tutor">Tutor</option>
                    </select>

                    <label class="mt-4">Minimum rating</label>

                    <select id="ratingFilter" class="form-select">
                        <option value="0">Any rating</option>
                        <option value="4">4+ stars</option>
                        <option value="4.5">4.5+ stars</option>
                        <option value="4.8">4.8+ stars</option>
                    </select>

                    <label class="mt-4">Maximum price</label>

                    <input
                        type="range"
                        class="form-range"
                        id="priceFilter"
                        min="1000"
                        max="10000"
                        value="10000"
                    >

                    <div class="price-display">
                        Up to Rs. <span id="priceValue">10,000</span>
                    </div>

                </div>

            </div>


            <!-- PROVIDERS -->
            <div class="col-lg-9">

                <div class="results-header">
                    <div>
                        <strong id="resultsCount">6</strong>
                        professionals found
                    </div>

                    <select id="sortFilter" class="form-select sort-select">
                        <option value="rating">Highest rated</option>
                        <option value="priceLow">Price: Low to High</option>
                        <option value="priceHigh">Price: High to Low</option>
                    </select>
                </div>

                <div
                    id="providersContainer"
                    class="row g-4"
                ></div>

            </div>

        </div>

    </div>
</section>

<script src="./script.js"></script>

</body>
</html>
