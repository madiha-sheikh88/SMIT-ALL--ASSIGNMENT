<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Provider Dashboard | HandyHive</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<nav class="navbar navbar-light fixed-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">

            <span class="logo-icon">
                <i class="bi bi-tools"></i>
            </span>

            Handy<span>Hive</span>

        </a>

        <div class="nav-actions">

            <button class="theme-btn" id="themeToggle">
                <i class="bi bi-moon"></i>
            </button>

            <a href="index.html" class="btn btn-outline-primary">
                Logout
            </a>

        </div>

    </div>

</nav>


<section class="section dashboard-page">

    <div class="container">

        <div class="dashboard-header">

            <div>

                <span class="section-label">
                    PROVIDER DASHBOARD
                </span>

                <h1>Welcome, Ahmed 👋</h1>

                <p>
                    Manage your incoming service requests.
                </p>

            </div>

        </div>


        <div class="dashboard-stats">

            <div class="dashboard-stat">

                <i class="bi bi-inbox"></i>

                <div>
                    <strong id="providerPending">0</strong>
                    <span>Pending requests</span>
                </div>

            </div>


            <div class="dashboard-stat">

                <i class="bi bi-tools"></i>

                <div>
                    <strong id="providerProgress">0</strong>
                    <span>In progress</span>
                </div>

            </div>


            <div class="dashboard-stat">

                <i class="bi bi-check-circle"></i>

                <div>
                    <strong id="providerCompleted">0</strong>
                    <span>Completed</span>
                </div>

            </div>

        </div>


        <div class="booking-table-card">

            <div class="table-header">

                <h4>Incoming bookings</h4>

            </div>

            <div class="table-responsive">

                <table class="table">

                    <thead>

                        <tr>
                            <th>Booking ID</th>
                            <th>Customer</th>
                            <th>Service</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="providerBookings"></tbody>

                </table>

            </div>

        </div>

    </div>

</section>


<script src="./script.js"></script>

</body>
</html>
