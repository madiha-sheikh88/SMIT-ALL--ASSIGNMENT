<!-- 3. Display 10 student records in table and each row should contain a delete button. If you click on a button to delete a record, entire row should be deleted. -->
<table style="width: 100%; border: 1px solid whitesmoke; text-align: center; margin-top: 50px;">
    <tr>
        <th>Student Name</th>
        <th>Age</th>
        <th>Class</th>
        <th>Action</th>
    </tr>
    <tr>    
        <td>Madiha Sheikh</td>
        <td>20</td>
        <td>12th</td>
        <td><button onClick="deleteRow(this)">Delete</button></td>
    </tr>
    <tr>
        <td>Umme Salma</td>
        <td>19</td>
        <td>11th</td>
        <td><button onClick="deleteRow(this)">Delete</button></td>
    </tr>
    <tr>
        <td>Fatima Ali</td>
        <td>21</td>
        <td>12th</td>
        <td><button onClick="deleteRow(this)">Delete</button></td>
    </tr>
</table>
<script>
function deleteRow(button) {
    let row = button.closest("tr"); 
    row.remove();
}
</script>

<!-- 5. Show a counter in browser. Counter should increase on click on increase button and decrease on click on decrease button. And show updated counter value in browser. -->

<div>
    <h2>Counter</h2>
    <button style="width: 80px; background-color: #e00c0c;" onClick="decreaseCounter()">-</button>
    <span id="counterValue">0</span>
    <button style="width: 80px; background-color: #4CAF50;" onClick="increaseCounter()">+</button>
</div>
<script>
    let counter = 0;

    function increaseCounter() {
        counter++;
        document.getElementById("counterValue").innerHTML = counter;
    }

    function decreaseCounter() {
        counter--;
        document.getElementById("counterValue").innerHTML = counter;
    }
</script>
